<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 156 46" width="156" height="46" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&amp;display=swap');
      .brand-title {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 34px;
        font-weight: 900;
        fill: #FFFFFF;
        letter-spacing: 3px;
      }
    </style>
    <!-- Vibrant Amber to Neon Violet Gradient -->
    <linearGradient id="ritikGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DF8908"/>
      <stop offset="50%" stop-color="#E92EC7"/>
      <stop offset="100%" stop-color="#B415FF"/>
    </linearGradient>

    <!-- Enhanced Glowing Shadow for Maximum Clarity & Contrast -->
    <filter id="logoGlow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <filter id="dotGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Signature Brand Fluid Gradient Swash Underneath K and Dot -->
  <path d="M 78 37 C 96 42, 122 43, 136 33 C 139 30, 144 34, 138 38 C 122 45, 92 44, 74 39 Z" fill="url(#ritikGrad)" opacity="0.95" />

  <!-- Clean Bold Pure White Typography "RITIK" -->
  <text x="3" y="34" class="brand-title" filter="url(#logoGlow)">RITIK</text>

  <!-- Glowing Brand Gradient Dot -->
  <circle cx="134" cy="29" r="5.5" fill="url(#ritikGrad)" filter="url(#dotGlow)" />
</svg>